<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Sellers</title>

<style>
    body{
        margin:0;
        padding:0;
        background:#f2f2f2;
        font-family: "Poppins", sans-serif;
        display: flex;
    }
    
    /* Vertical Navigation Bar */
    .navbar{
        width: 200px;
        height: 100vh;
        background:#ffd6df;
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 3px 0px 10px rgba(0,0,0,0.1);
        position: fixed;
        top: 0;
        left: 0;
        z-index: 100;
    }

    .nav-logo{
        font-size: 26px;
        font-weight: 700;
        color: #ff4fa7;
        font-family: "Comic Sans MS", cursive;
        margin-bottom: 30px;
        text-align: center;
    }

    .nav-links{
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    .nav-links a{
        text-decoration: none;
        padding: 15px 25px;
        color: #333;
        font-size: 15px;
        font-weight: 500;
        transition: all 0.3s ease;
        border-left: 3px solid transparent;
    }

    .nav-links a:hover{
        color: #ff4fa7;
        background: rgba(255, 255, 255, 0.3);
        border-left: 3px solid #ff4fa7;
    }

    .nav-links a.active {
        color: #ff4fa7;
        background: rgba(255, 255, 255, 0.5);
        border-left: 3px solid #ff4fa7;
    }

    /* Main Content Area */
    .main-content {
        margin-left: 200px;
        width: calc(100% - 200px);
    }

    .section{
        width:100%;
        background:#ffd6df;
        padding:40px 0 70px 0;
        text-align:center;
    }

    .title{
        font-size:50px;
        font-family:"Comic Sans MS", cursive;
        color:#ff66c4;
        margin-bottom:40px;
    }

    .grid{
        width:90%;
        margin:auto;
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        row-gap:50px;
        column-gap:40px;
        justify-items:center;
    }

    .card{
        background:white;
        width:260px;
        padding:20px;
        border-radius:10px;
        box-shadow:0px 3px 10px rgba(0,0,0,0.1);
        text-align:center;
        transition:0.3s;
    }

    .card:hover{
        transform:translateY(-5px);
    }

    .card img{
        width:100%;
        height:180px;
        object-fit:contain;
    }

    .product-name{
        margin-top:15px;
        font-size:14px;
        letter-spacing:1px;
        font-weight:600;
    }

    .price{
        margin:5px 0 12px 0;
        font-weight:600;
    }

    .btn{
        background:#c2f7fb;
        padding:8px 20px;
        border-radius:20px;
        font-size:12px;
        cursor:pointer;
        border:none;
    }

    .btn:hover{
        background:#a8eef4;
    }

    /* Responsive adjustments */
    @media (max-width: 1100px) {
        .grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 768px) {
        .navbar {
            width: 70px;
        }
        
        .nav-logo {
            font-size: 16px;
        }
        
        .nav-links a {
            padding: 15px 10px;
            font-size: 12px;
            text-align: center;
        }
        
        .nav-links a span {
            display: none;
        }
        
        .main-content {
            margin-left: 70px;
            width: calc(100% - 70px);
        }
        
        .grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>
