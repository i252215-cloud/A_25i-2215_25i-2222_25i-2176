<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="payment_page.css">
</head>
<body>

<div class="container">

    
    <div class="left">
        <div class="logo-back">
              <button class="back-btn"><i class="fas fa-arrow-left"></i></button>
            
            <img src="https://i.ibb.co/nqwmpCdg/Toy-Planet-Logo.png" alt="Toy Planet Logo" class="logo">
        </div>

        <h2>Total payment</h2>
        <h1 class="price">$405.00</h1>

        <div class="item">
            <img src="https://i.ibb.co/7J3sm3g1/pack-of-twenty-cars.png">
            <p>Pack of twenty cars <br><span>Qty 1</span></p>
            <span class="amount">$100</span>
        </div>

        <div class="item">
            <img src="https://i.ibb.co/93Hr9xxF/lego.png">
            <p>3 in 1 lego set <br><span>Qty 1</span></p>
            <span class="amount">$200</span>
        </div>

        <div class="item">
            <img src="https://i.ibb.co/wfgJ5Z5/teddy.png">
            <p>Teddy bears <br><span>Qty 1</span></p>
            <span class="amount">$50</span>
        </div>

        <div class="summary">
            Tax <span>$50</span><br>
            Sub Total <span>$400</span><br>
            Shipping Tax <span>$50</span>
        </div>

        <h2 class="total-line">Total Due <span>$405</span></h2>
    </div>

    
    <div class="right">

        <button class="apple-pay"> Pay</button>

        <p class="or-line">---------- OR PAY WITH CARD ----------</p>

        <form>
            <h3>Shipping Information:</h3>
            <input type="email" placeholder="Email">

            <h3>Shipping address</h3>
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Country">
            <input type="text" placeholder="Address">

            <h3>Payment Details</h3>
            <input type="text" placeholder="Card information">
            <input type="text" placeholder="MM / YY">

            <label class="checkbox">
                <input type="checkbox"> Billing Address is same as shipping 
            </label>

            <button class="pay-btn">Pay $405</button>
        </form>

    </div>

</div>
<script src="payment_page.js"></script>


</body>
</html>
